name: Validate

on:
    pull_request:
        branches: [main]

jobs:
    validate:
        name: validate
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install tools
              run: pip install black ruff pytest

            - name: Check formatting
              run: black --check dsa/

            - name: Lint
              run: ruff check dsa/

            - name: Test
              run: python -m pytest dsa/tests/ -v
